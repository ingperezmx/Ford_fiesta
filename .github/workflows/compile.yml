name: Compilar APK de Car Launcher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4
      with:
        # Historial completo (incluye etiquetas): se necesita para listar
        # los cambios desde el release anterior en las notas de la version.
        fetch-depth: 0

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Instalar SDK de Android 16 (API 36)
      # compileSdk/targetSdk 36 (obligatorio para Google Play desde
      # el 31-ago-2026). El runner trae varias plataformas, pero esta
      # asegura que esten la 36 y sus build-tools.
      run: |
        echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

    - name: Dar permisos de ejecucion a Gradle
      run: chmod +x gradlew

    - name: Recuperar clave de lanzamiento guardada
      # La clave privada vive en los secretos del repositorio (cifrados):
      # RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
      # RELEASE_KEY_PASSWORD y RELEASE_KEY_ALIAS. Se reconstruye fuera del
      # repo, en ../../tools/, que es donde build.gradle.kts la busca para
      # firmar el release. Asi todos los builds (locales y de GitHub) usan
      # LA MISMA firma y el APK se instala encima sin desinstalar.
      # Nunca se genera una clave nueva aqui: eso cambiaba la firma en
      # cada corrida y obligaba a borrar y reinstalar la app.
      run: |
        mkdir -p "$GITHUB_WORKSPACE/../../tools"
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/../../tools/release.keystore"
        printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" "${{ secrets.RELEASE_KEY_PASSWORD }}" "${{ secrets.RELEASE_KEY_ALIAS }}" > "$GITHUB_WORKSPACE/../../tools/release-keystore.properties"

    - name: Compilar APK Oficial Firmado
      env:
        MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      run: ./gradlew assembleRelease

    - name: Generar etiqueta de tiempo para la Version
      id: date
      run: echo "VERSION_TAG=v1.0.$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

    - name: Generar notas de la version (cambios desde el release anterior)
      # Cada cambio queda en las notas del release: se listan los mensajes
      # de los commits desde la etiqueta del release anterior, asi no hay
      # que editar el texto a mano en cada version.
      run: |
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          CHANGES=$(git log --pretty=format:"- %s" "$LAST_TAG"..HEAD)
        else
          CHANGES=$(git log --pretty=format:"- %s" -10)
        fi
        if [ -z "$CHANGES" ]; then
          CHANGES="- $(git log --pretty=format:"%s" -1)"
        fi
        {
          echo "### 🚀 Car Launcher - Build Automática de Producción"
          echo "Compilada desde el código de la rama main y firmada con la clave de lanzamiento guardada, así que se instala encima de la versión anterior sin desinstalar."
          echo ""
          echo "**Cambios en esta versión:**"
          echo "$CHANGES"
          echo ""
          echo "**Incluye:**"
          echo "- 📍 Solo datos reales: GPS real y telemetría OBD-II (sin simulados)."
          echo "- 🔍 Búsqueda de lugares (Nominatim/OpenStreetMap, México y todo el continente americano) con navegación guiada paso a paso (OSRM, maniobras e instrucciones)."
          echo "- 🎵 Control de YouTube Music / Spotify desde la app (acceso a notificaciones, botones del volante y FYT, botón Reconectar, sin cuenta ni API)."
          echo "- 🎨 8 colores oficiales Ford Fiesta (solo cambia la carrocería; ventanas, llantas y faros quedan intactos) e imágenes de Ford Fiesta."
          echo "- 🖼️ Icono de Ford Fiesta azul."
          echo "- 📻 Radio FM por internet (Exa, LOS40, Génesis, Classic, D99, Rock en Español, KEXP)."
          echo "- 🎤 Karaoke con letras y traducción."
          echo "- 🌤️ Clima en tiempo real."
          echo "- 🎭 6 temas."
          echo "- 🪟 Acceso rápido al Launcher Principal."
          echo "- 📐 Tablero adaptable a cualquier pantalla (se escala en proporción, sin nada movido)."
          echo "- 🔐 Firmada con la clave de lanzamiento propia (misma firma en cada build)."
          echo "- 📱 Android 16 (API 36)."
        } > release-body.md
        cat release-body.md

    - name: Crear Release Automatica en GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION_TAG }}
        name: "Car Launcher Build - ${{ env.VERSION_TAG }}"
        body_path: release-body.md
        draft: false
        prerelease: false
        files: app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
